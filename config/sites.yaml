# =====================================================================
# LISTA DE SITES QUE O ROBÔ VISITA
# =====================================================================
# Cada site é um bloco começando com "- nome:". Campos:
#   nome:     nome curto do órgão (aparece no e-mail)
#   grupo:    estadual | municipal | camara | banca | sistema_s
#   url:      página onde saem os editais/seleções
#   ativo:    true = o robô visita / false = o robô pula
#   confirmada: true só quando a página foi aberta e conferida como oficial.
#               Se false, o robô pula (não visitamos endereço chutado).
#   obs:      anotação livre pra gente lembrar o porquê das coisas
#
# Para adicionar um site: copie um bloco, mude os campos e rode
#   python -m robo.testar_sites
# para ver se o robô consegue ler.
# =====================================================================

sites:

  # ---------------- ÓRGÃOS E EMPRESAS ESTADUAIS ----------------
  # ATENÇÃO: quase todos os sites .pa.gov.br derrubam conexões vindas de
  # fora do Brasil. Os testes daqui (servidor nos EUA) não conseguiram abrir.
  # Precisam ser testados de um computador no Brasil.

  - nome: Sipros (portal de PSS do Governo do Pará)
    grupo: estadual
    url: https://www.sipros.pa.gov.br
    ativo: true
    confirmada: false
    obs: Portal central onde SESPA, Santa Casa, Prodepa, Seaf, Iasep, Parápaz etc. publicam PSS. Bloqueou conexão do exterior.

  - nome: SESPA
    grupo: estadual
    url: https://www.sespa.pa.gov.br
    ativo: true
    confirmada: false
    obs: PSS publicados via Sipros. Bloqueou conexão do exterior.

  - nome: SEAD
    grupo: estadual
    url: https://www.sead.pa.gov.br
    ativo: true
    confirmada: false
    obs: Bloqueou conexão do exterior.

  - nome: SEDUC
    grupo: estadual
    url: https://pss.seduc.pa.gov.br
    ativo: true
    confirmada: false
    obs: Portal de PSS da Seduc (citado nos editais). Bloqueou conexão do exterior.

  - nome: UEPA
    grupo: estadual
    url: https://www.uepa.br
    ativo: true
    confirmada: false
    obs: Editais em uepa.br/sites/default/files/editais/. Bloqueou conexão do exterior.

  - nome: Hemopa
