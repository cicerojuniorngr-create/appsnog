# =====================================================================
# PALAVRAS-CHAVE DO ROBÔ
# =====================================================================
# Pode editar à vontade. Regras:
#  - Maiúscula/minúscula e acento NÃO importam ("Orçamento" = "orcamento").
#  - A comparação é por palavra inteira: "TI" não casa com "aTIvidades".
#  - Cada item começa com "- " e fica numa linha própria.
#
# COMO O ROBÔ DECIDE (resumão):
#  1) O título/resumo precisa falar de seleção ("tipos_selecao").
#     (Sites marcados com pagina_so_de_vagas no sites.yaml, que só listam
#     vagas, trocam isso por: o título/resumo já cita um cargo ou área.)
#  2) Se o título/resumo tiver algo de "bloqueio", ou o título tiver algo
#     de "nao_e_abertura" -> descartado.
#  3) Passa se:
#     a) aparecer um nome de CARGO (lista "cargos") no título, no resumo
#        ou dentro do edital; OU
#     b) aparecer uma ÁREA/ATIVIDADE (lista "areas") no título ou resumo,
#        e o título/resumo NÃO tiver nada de "fora_do_perfil".
#
# Por que separar cargo de área? Palavras como "recursos humanos" e
# "orçamento" aparecem em quase todo edital como nome de setor ("entregar
# documentos na Diretoria de Recursos Humanos"). Então dentro do edital só
# contam nomes de cargo. Já "fora_do_perfil" serve pra que um edital de
# Contador que fale em "orçamento" não passe, mas um de Assistente Financeiro
# que cite "contabilidade" nas tarefas continue passando.
# =====================================================================

# Etapa 1: isso é uma seleção que interessa?
tipos_selecao:
  - processo seletivo simplificado
  - processo seletivo
  - pss
  - seleção pública
  - seleção simplificada
  - contratação temporária
  - contratação por tempo determinado
  - credenciamento
  - cadastro reserva
  - cadastro de reserva

# Nomes de cargo: valem em qualquer lugar (título, resumo, edital).
cargos:
  administrativo:
    - assistente administrativo
    - auxiliar administrativo
    - técnico administrativo
    - analista administrativo
    - agente administrativo        # muito comum nos órgãos do Pará
    - apoio administrativo
    - assistente de administração  # nome usado pelo Senac
    - auxiliar de administração
    - técnico em administração
    - analista de administração
    - auxiliar de escritório
    - secretária executiva         # "secretária" sozinha casaria com "Secretaria de Estado"
    - secretário executivo
    - recepcionista administrativo
  financeiro:
    - assistente financeiro
    - analista financeiro
    - técnico financeiro
    - auxiliar financeiro
  dp_rh:
    - assistente de rh
    - analista de rh
    - técnico em rh
    - auxiliar de rh
    - assistente de recursos humanos
    - analista de recursos humanos
    - auxiliar de recursos humanos
    - assistente de departamento pessoal
    - auxiliar de departamento pessoal
    - analista de departamento pessoal

# Áreas/atividades: valem só no título ou no resumo da listagem.
areas:
  financeiro:
    - contas a pagar
    - contas a receber
    - tesouraria
    - orçamento
    - faturamento
    - medição
    - planejamento orçamentário
  dp_rh:
    - departamento pessoal
    - folha de pagamento
    - recursos humanos
    - gestão de pessoas
    - rotinas de pessoal

# Descarta se aparecer no título ou no resumo da listagem.
# (No corpo do edital não: lá é comum "estágio não conta como experiência"
# e "este processo não é concurso público".)
bloqueio:
  - estágio
  - estagiário
  - estagiários
  - concurso público

# Descarta se aparecer no TÍTULO: são publicações de processos que já
# andaram (chamada de aprovados, resultado...), não inscrição nova.
# Retificação NÃO está aqui de propósito: ela pode prorrogar o prazo.
nao_e_abertura:
  - convocação
  - convoca
  - resultado
  - gabarito
  - homologação
  - homologa
  - classificação
  - aprovados
  - habilitados

# Só atrapalham quando o edital passou apenas por "areas" (regra 3b).
fora_do_perfil:
  - contador
  - contabilidade
  - médico
  - enfermeiro
  - técnico de enfermagem
  - farmacêutico
  - odontólogo
  - engenheiro
  - arquiteto
  - ti
  - tecnologia da informação
  - motorista
  - professor
  - vigilante
  - serviços gerais
  - cozinheiro
